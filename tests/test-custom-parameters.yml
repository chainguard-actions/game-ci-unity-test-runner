name: Test customParameters input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: '2022.3.0f1'
          customParameters: '-nographics -batchmode'
          testMode: 'editmode'
          artifactsPath: 'artifacts'

      - name: Assert action ran with customParameters (fails gracefully without Unity license/project)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with customParameters"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Unity license or project available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
